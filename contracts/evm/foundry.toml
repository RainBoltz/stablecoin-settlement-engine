[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# 這個專案刻意維持零外部依賴，只用 forge-std。
# ERC-20 的安全包裝（SafeERC20 之類）留到 Day 17 再談，現在要先讓陷阱裸露出來。
remappings = ["forge-std/=lib/forge-std/src/"]

# Day 3：部署腳本會把地址寫進 deployments/<chainId>.json。
# 只對這一個目錄開讀寫，腳本與測試碰不到專案裡的其他檔案。
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
# forge script / forge test 可以用別名代替 URL：--rpc-url anvil
anvil = "http://127.0.0.1:8545"
# fork 測試用；沒設環境變數時這個別名不會被解析，離線跑測試不受影響
mainnet = "${ETH_RPC_URL}"

[lint]
# ERC-20 規定 name / symbol / decimals 必須是這三個小寫名稱，不能改成 SCREAMING_SNAKE_CASE，
# 否則 ABI 對不上、所有錢包與 indexer 都讀不到。mock 也不需要為了省 code size 去拆 modifier。
exclude_lints = ["screaming-snake-case-const", "screaming-snake-case-immutable", "unwrapped-modifier-logic"]

[fuzz]
runs = 512

[fmt]
line_length = 120
