[package]
name = "payout-run"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "~2.2"

[dev-dependencies]
solana-program-test = "~2.2"
solana-sdk = "~2.2"
spl-token = { version = "6", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros"] }

[lints.rust]
# solana_program::entrypoint! 的巨集在 2.x 會踩到 unexpected_cfgs，上游的已知噪音，不是本程式的設定。
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))'] }
